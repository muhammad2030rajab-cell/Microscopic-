name: Unpack Rajab Diagnostics

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unpack latest ZIP
        run: |
          set -e
          ZIP=$(ls -t *.zip | head -n 1)
          mkdir -p /tmp/app
          unzip -q "$ZIP" -d /tmp/app
          cp -a /tmp/app/. .
          rm -rf /tmp/app
          rm -f *.zip

      - name: Commit application source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Deploy Rajab Diagnostics source"
          git push
