name: Create Flutter Android App

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-flutter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.0"
          channel: stable

      - name: Create Flutter project
        run: |
          rm -f mobile/README.md
          flutter create mobile \
            --org com.microscopic.system \
            --project-name microscopic \
            --platforms android

      - name: Commit Flutter project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile
          git commit -m "Create Flutter Android app"
          git push
